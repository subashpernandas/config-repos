spring.application.name=college-registration
server.port=8090

# Eureka server URL (replace with your Eureka server host:port)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Whether to register itself to Eureka
eureka.client.register-with-eureka=true

# Whether to fetch registry from Eureka
eureka.client.fetch-registry=true

# Instance hostname (optional, defaults to machine hostname)
eureka.instance.hostname=localhost

# Prefer using IP address instead of hostname
eureka.instance.prefer-ip-address=true

#spring.cloud.compatibility-verifier.enabled=false

# --- Database Connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/micro_services?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useLegacyDatetimeCode=false
spring.datasource.username=root
spring.datasource.password=root

# --- MySQL Driver ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Optional: Format SQL in logs
spring.jpa.properties.hibernate.format_sql=true

# Optional: Naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl



